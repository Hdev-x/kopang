# ================================================================
# Kopang Backend — 공통 설정 (모든 프로파일, git 추적 O)
# 시크릿·환경 의존 값은 application-dev.properties (git 추적 X)
# ================================================================
spring.application.name=backend
spring.profiles.active=dev
server.port=8080

# ----- 파일 업로드 -----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----- MyBatis -----
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DB snake_case(user_id) -> Java camelCase(userId) 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# ----- JWT 정책 (기술선택 확정: access 15분 / refresh 7일) -----
jwt.access-token-validity-ms=900000
jwt.refresh-token-validity-ms=604800000

## 스케줄
churn.batch.cron=0 0 3 * * *
